# Nginx server that serves the built Vue app
server {
    # Listen for HTTP requests on port 80
    listen 80;
    # Server name this block responds to
    server_name localhost;

    # Folder where the dist files are copied inside the container
    root /usr/share/nginx/html;
    # Default file served for a folder request
    index index.html;

    # SPA fallback: serve index.html for client-side routes
    location / {
        # Try the exact file, then a folder, otherwise index.html
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        # Browsers keep these files for one year
        expires 1y;
        # Tell browsers the files never change
        add_header Cache-Control "public, immutable";
    }
}
